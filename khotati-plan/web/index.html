<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101826"><title>خطتي</title>
<style>
:root{--bg:#101826;--cd:#172033;--cd2:#202b42;--bd:#2c3a56;--tx:#e4eaf6;--mu:#93a3bf;--ac:#52c7b8;--g:#22c55e;--y:#f59e0b;--r:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;direction:rtl;overflow:hidden}
body{display:flex;flex-direction:column}
html.native body{padding-top:max(env(safe-area-inset-top),38px)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex:none}
header b{font-size:22px;display:block;color:var(--ac)}header small{color:var(--mu);font-size:12px}
#gear{background:var(--cd);border:1px solid var(--bd);border-radius:12px;font-size:20px;padding:8px 11px;color:#fff}
main{flex:1;overflow-y:auto;padding:4px 14px 18px;min-height:0;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;cursor:pointer}
nav{display:flex;flex:none;background:#0e1626;border-top:1px solid var(--bd);padding:6px 4px calc(6px + max(env(safe-area-inset-bottom),0px))}
html.native nav{padding-bottom:max(env(safe-area-inset-bottom),30px)}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--ac);background:var(--cd)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
h3{margin:18px 4px 6px;font-size:15px;color:var(--ac)}h4{margin:8px 0 2px;font-size:17px}
.sm,small{color:var(--mu);font-size:12px;display:block}
.dn{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.dn>div{text-align:center}.dn b{font-size:20px;display:block}
.dn button{background:var(--cd);border:1px solid var(--bd);border-radius:14px;width:48px;height:48px;font-size:24px;color:#fff}
.tdy{width:100%;background:var(--cd2);border:1px solid var(--ac);color:var(--ac);border-radius:12px;padding:10px;font-weight:700;margin-bottom:4px}
.hero{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c,var(--ac)) calc(var(--p)*1%),#2c3a56 0)}
.ring.g{--c:var(--g)}.ring.y{--c:var(--y)}.ring.r{--c:var(--r)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-weight:800;font-size:18px}
.sites{background:var(--cd2);line-height:1.9;font-size:14px}
.it .ih{display:flex;gap:12px;align-items:center}.it .ic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--cd2);border-radius:12px}
.it b{font-size:16px;display:block}
.it .pl{margin:10px 2px;font-size:15px;line-height:1.6;color:#cfd9ef}
.it.na{opacity:.45}.it.d0{border-color:#166534}.it.d1{border-color:#92610a}.it.d2{border-color:#7f1d1d}
.chs{display:flex;gap:6px;margin-top:8px}
.ch{flex:1;border:1px solid var(--bd);background:var(--cd2);border-radius:12px;padding:11px 4px;font-size:13px;font-weight:700;color:var(--mu)}
.ch.on.c0{background:#14532d;border-color:var(--g);color:#bbf7d0}.ch.on.c1{background:#78350f;border-color:var(--y);color:#fde68a}.ch.on.c2{background:#7f1d1d;border-color:var(--r);color:#fecaca}
textarea,input.bn{width:100%;margin-top:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{text-align:center;margin:0}.sc b{font-size:28px;display:block}.sc.g b{color:var(--g)}.sc.y b{color:var(--y)}.sc.r b{color:var(--r)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:right;color:var(--tx);margin:6px 0;padding:12px}
.row>span{width:96px;font-weight:700;font-size:14px;flex:none}.row small{font-weight:400}
.cat>span{width:128px;font-size:13px}.row b{width:44px;text-align:left;flex:none}.row em{font-style:normal;font-size:11px;width:58px;text-align:center;flex:none;font-weight:700}
em.g{color:var(--g)}em.y{color:var(--y)}em.r{color:var(--r)}
.bar{flex:1;height:10px;background:#2c3a56;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.bar i.g{background:var(--g)}.bar i.y{background:var(--y)}.bar i.r{background:var(--r)}
.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:#7f1d1d;color:#fecaca;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}.tag.t2{background:#1e3a8a;color:#bfdbfe}.tag.t3{background:#78350f;color:#fde68a}
.bk p{margin:6px 0;font-size:14px;line-height:1.7;color:#cfd9ef}.kv{font-size:13.5px;line-height:1.7;color:#cfd9ef;margin:3px 0}.kv b{color:var(--mu)}
.do{color:#bbf7d0;font-size:13.5px;line-height:1.7;margin-top:6px}.dont{color:#fecaca;font-size:13.5px;line-height:1.7;margin-top:6px}
.rl.do{border-color:#166534}.rl.dont{border-color:#7f1d1d}.rl p{margin:6px 0 0;line-height:1.7;color:#e2e8f0;font-size:14px}
.cnt{display:flex;align-items:center;gap:12px;margin-top:12px}.cnt>div{flex:1;text-align:center}.cnt button{width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--cd2);font-size:24px;color:#fff}
.wk.now{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:100}#sheet[hidden]{display:none}
#sheet .box{background:var(--cd);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + max(env(safe-area-inset-bottom),30px))}
.big{display:block;width:100%;background:#17877c;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;margin:9px 0;color:#fff}.big.s{background:var(--cd2)}.big.danger{background:#7f1d1d}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;font-size:14px;max-width:90%;text-align:center;z-index:200}#toast.s{opacity:1}
.pr .dl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pr .dl b{font-size:17px;color:var(--ac)}.pr .dl span{color:var(--mu);font-size:13px}
.pr .nx{margin:8px 0;font-size:14px;color:#fde68a}.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}.pg>div{background:var(--cd2);border-radius:10px;padding:7px 1px}.pg small{display:block;font-size:11px}.pg b{font-size:12px}.pg .sr{opacity:.7}.pc{margin-top:6px}.pg.mini{margin:8px 0}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cw small{padding:4px 0;font-weight:700}.cd{background:var(--cd2);border:1px solid transparent;border-radius:12px;padding:6px 0 4px;color:var(--tx);min-height:54px;display:flex;flex-direction:column;align-items:center;gap:0}.cd b{font-size:15px}.cd small{font-size:10px;color:var(--mu)}.cd u{display:flex;gap:3px;height:6px;margin-top:2px}.cd s{width:6px;height:6px;border-radius:50%;display:block}.cd s.e{background:var(--y)}.cd s.t{background:var(--g)}.cd.tdy2{border-color:var(--ac)}.cd.sel{background:#134e4a}
.ev{display:flex;justify-content:space-between;align-items:center}.ev button{background:none;border:0;font-size:20px}.fr{display:flex;gap:10px;align-items:center}.fr .bn{flex:1}
select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px;font:inherit;margin:6px 0}.tg{display:flex;align-items:center;gap:8px;padding:9px 2px;font-size:15px}.tg input{width:22px;height:22px}.tg select{width:auto;margin:0}
#sheet .box.scr{max-height:88vh;overflow-y:auto}nav button{font-size:10px}
.mb{background:var(--cd2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0}.mb.on{border-color:var(--ac)}.mb b{font-size:15px}.mb .tp{margin:6px 0;color:#fde68a;font-size:14px;line-height:1.6}.mb .kv{font-size:12.5px}
.gy{margin:8px 0}.gp{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.gb{background:var(--cd2);border:1px solid var(--bd);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;color:var(--mu)}.gb.on{background:#14532d;border-color:var(--g);color:#bbf7d0}
.mb .kv b,.it .mb .kv b{display:inline;font-size:inherit}.it .mb b{display:block}.it .mb .kv b{display:inline}main{padding-inline:max(14px,2vw)}
.ban{position:relative;border-radius:22px;overflow:hidden;margin:10px 0;border:1px solid var(--bd);background:#0e1626}
.ban img{display:block;width:100%;aspect-ratio:1/1;max-height:62vh;object-fit:cover;object-position:50% 22%}
.ban .ov{position:absolute;left:0;right:0;bottom:0;padding:70px 16px 14px;background:linear-gradient(transparent,rgba(9,14,26,.94))}
.ban .dl{display:block}.ban .dl span{display:block;font-size:14px}.ban .dl b{font-size:22px;color:#fff}.ban .dl span{color:#cfd9ef}.ban .nx{margin:6px 0 0;font-size:15px}
@media (min-width:1000px){main{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px;align-content:start;align-items:start}.dn,.tdy,main>h3,.pg.wide,.grid3{grid-column:1/-1}.ban{grid-row:span 5}.ban img{max-height:640px;aspect-ratio:1/1.05}}
@media (min-width:1600px){main{grid-template-columns:repeat(3,1fr)}.ban{grid-row:span 4}}
</style></head><body><script type="module" src="app.js"></script></body></html>
