name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'khotati-android/**', '.github/workflows/khotati.yml', 'mohamed-caller/**', 'khotati-plan/**', 'khotati-desktop/**', '.github/workflows/khotati-desktop.yml', '.github/workflows/khotati-plan.yml', '.github/workflows/caller.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web assets
        run: |
          mkdir www
          cp index.html app.js manifest.webmanifest icon-192.png icon-512.png www/ && cp -r pdfjs www/
      - run: npm install
      - run: npx cap add android
      - name: Icons and version
        run: |
          pip install pillow
          python3 make_icons.py
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Align and sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore ks.jks -alias pen -keyalg RSA -keysize 2048 -validity 12000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Engineer Pen, O=Personal"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias pen --out EngineerPen.apk aligned.apk
          "$BT/apksigner" verify EngineerPen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EngineerPen-apk
          path: EngineerPen.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" EngineerPen.apk --title "Engineer Pen v1.${{ github.run_number }}" --notes "APK للتثبيت على أندرويد" --latest
