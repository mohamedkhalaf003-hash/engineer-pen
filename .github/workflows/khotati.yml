name: Build Khotati APK
on:
  push:
    branches: [main]
    paths: ['khotati-android/**', '.github/workflows/khotati.yml']
  workflow_dispatch: {}
permissions:
  contents: write
defaults:
  run:
    working-directory: khotati-android
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: for i in 1 2 3; do gradle assembleDebug --no-daemon && break; echo retry $i; sleep 45; done; test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Khotati.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: khotati-v${{ github.run_number }}
          name: خطتي ${{ github.run_number }}
          files: khotati-android/Khotati.apk
          make_latest: 'false'
