name: Build Mashari3 APK (مراجعة مشاريع)
on:
  push:
    branches: [main]
    paths: ['review/**', 'review-android/**', 'app.js', 'pdfjs/**', '.github/workflows/review-android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
defaults:
  run:
    working-directory: review-android
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web assets
        run: |
          mkdir www
          cp ../review/* www/
          cp -r ../pdfjs www/pdfjs
          cp ../review/app.js www/app.js
          echo '{"v":${{ github.run_number }}}' > www/version.json
      - run: npm install
      - run: npx cap add android
      - name: Icons and version
        run: |
          pip install pillow
          python3 make_icons.py
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Align and sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          else
            cp "$GITHUB_WORKSPACE/signing/release.jks" ks.jks; PASS="d58e0c05877aa6758d91216e"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias pen --out Mashari3.apk aligned.apk
          "$BT/apksigner" verify Mashari3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mashari3-apk
          path: review-android/Mashari3.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "review-v1.${{ github.run_number }}" Mashari3.apk --title "مراجعة مشاريع - جوال v1.${{ github.run_number }}" --notes "APK مراجعة مشاريع لأندرويد" --latest=false
