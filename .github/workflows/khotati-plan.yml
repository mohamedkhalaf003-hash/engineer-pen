name: Build Khotati Plan APK
on:
  push:
    branches: [main]
    paths: ['khotati-plan/**', '.github/workflows/khotati-plan.yml']
  workflow_dispatch: {}
permissions:
  contents: write
defaults:
  run:
    working-directory: khotati-plan
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir www && cp web/* www/
      - run: npm install
      - run: npx cap add android
      - name: Manifest, icons and version
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          '''
          perms+='''    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
          '''
          comps='''<receiver android:name=".AlarmReceiver" android:exported="false"/>
              <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>
              <service android:name=".AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
              <activity android:name=".AlarmActivity" android:exported="false" android:showWhenLocked="true" android:turnScreenOn="true" android:launchMode="singleTop" android:excludeFromRecents="true" android:theme="@android:style/Theme.Material.NoActionBar"/>
          '''
          s=s.replace('<application',perms+'<application',1)
          s=s.replace('</application>',comps+'</application>',1)
          open(p,'w').write(s)
          PY
          mkdir -p android/app/src/main/java/com/mohamed/khotatiplan
          cp android-extra/*.java android/app/src/main/java/com/mohamed/khotatiplan/
          echo '{"v":${{ github.run_number }}}' > www/version.json
          pip install pillow
          python3 make_icons.py
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release APK
        run: cd android && for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && break; echo retry $i; sleep 45; done; test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Align and sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          elif [ -f "$GITHUB_WORKSPACE/signing/release.jks" ]; then
            cp "$GITHUB_WORKSPACE/signing/release.jks" ks.jks; PASS="d58e0c05877aa6758d91216e"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore ks.jks -alias pen -keyalg RSA -keysize 2048 -validity 12000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Khotati Plan, O=Personal"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias pen --out Khotati.apk aligned.apk
          "$BT/apksigner" verify Khotati.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khotati-apk
          path: khotati-plan/Khotati.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "khotati-plan-v1.${{ github.run_number }}" Khotati.apk --title "Khotati Plan v1.${{ github.run_number }}" --notes "APK خطتي" --latest=false
